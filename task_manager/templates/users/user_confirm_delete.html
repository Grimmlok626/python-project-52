{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<h2>Подтверждение удаления</h2>
<p>Вы уверены, что хотите удалить пользователя {{ object.username }}?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Да, удалить</button>
    <a href="{% url 'users:list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
