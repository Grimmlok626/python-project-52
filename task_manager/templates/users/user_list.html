{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<h2>Пользователи</h2>
<a href="{% url 'users:create' %}" class="btn btn-success mb-3">Создать пользователя</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Имя пользователя</th>
            <th>Имя</th>
            <th>Фамилия</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
    {% for user in users %}
        <tr>
            <td>{{ user.username }}</td>
            <td>{{ user.first_name }}</td>
            <td>{{ user.last_name }}</td>
            <td>
                <a href="{% url 'users:update' user.pk %}" class="btn btn-sm btn-primary">Изменить</a>
                <a href="{% url 'users:delete' user.pk %}" class="btn btn-sm btn-danger">Удалить</a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
