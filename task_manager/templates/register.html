{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<h2 class="text-center mb-4">Регистрация</h2>
<form method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
    </div>
</form>
{% endblock %}
