{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<h2>Статусы</h2>
<a href="{% url 'statuses:create' %}" class="btn btn-success mb-3">Создать статус</a>
<table class="table table-striped">
<tr>
    <th>Название</th>
    <th>Действия</th>
</tr>
{% for status in statuses %}
<tr>
    <td>{{ status.name }}</td>
    <td>
        <a href="{% url 'statuses:update' status.pk %}" class="btn btn-primary btn-sm">Изменить</a>
        <a href="{% url 'statuses:delete' status.pk %}" class="btn btn-danger btn-sm">Удалить</a>
    </td>
</tr>
{% empty %}
<tr><td colspan="2">Нет статусов</td></tr>
{% endfor %}
</table>
{% endblock %}
